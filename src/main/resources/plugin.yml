name: SkyblockSpawner
description: $description
version: '${version}'

main: org.enkop.skyblockSpawner.SkyblockSpawner
api-version: '1.21.11'
load: POSTWORLD

authors: [ EnKop ]

depend:
  - WorldGuard
softdepend:
  - WorldEdit
  - Essentials

commands:
  skyblockadmin:
    description: Admin commands for SkyblockSpawner
    aliases: [sba]
    permission: skyblockspawner.admin
    usage: /sba <next|peek|info|tp|reset|simulate> [args]